# Site settings used by GitHub Pages to build the articles section.
title: John Paul Lundberg
description: Maintenance Operation and Management engineer based in Oslo.
url: "https://jplundberg.com"
baseurl: ""
timezone: Europe/Oslo

# Publish articles and projects even if their date is later than the build time
# (GitHub builds in UTC, which is behind Norwegian time).
future: true

collections:
  articles:
    output: true
    permalink: /articles/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
      lang: en

  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en

exclude:
  - Readme.txt
  - cmd/build.py
  - forms/Readme.txt
  - assets/scss/Readme.txt
