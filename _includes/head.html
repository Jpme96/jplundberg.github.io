<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="format-detection" content="telephone=no">
  <script>
    /* Decide early whether to animate, so content never flashes before its entrance */
    (function () {
      try {
        var d = document.documentElement;
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var skip = sessionStorage.getItem('jpl-skip-intro') === '1';
        if (!reduce && !skip && 'IntersectionObserver' in window) {
          d.classList.add('motion');
          setTimeout(function () { if (!d.classList.contains('motion-ready')) d.classList.remove('motion'); }, 3000);
        }
      } catch (e) {}
    })();
  </script>
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta content="{{ page.summary | default: site.description | strip_html | escape }}" name="description">

  <meta property="og:type" content="article">
  <meta property="og:url" content="https://jplundberg.com{{ page.url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="https://jplundberg.com{{ page.image | default: '/assets/img/my-profile-img.jpg' }}">
  <meta name="twitter:card" content="summary">

  <link href="/assets/img/favicon.png?v=2" rel="icon">
  <link href="/assets/img/apple-touch-icon.png?v=2" rel="apple-touch-icon">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="/assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <link href="/assets/css/main.css?v={{ site.time | date: '%s' }}" rel="stylesheet">
  <link href="/assets/css/articles.css?v={{ site.time | date: '%s' }}" rel="stylesheet">
</head>
