{%- comment -%} Opens the contact form as a pop-up on this page. Without JavaScript the link opens the form on tally.so. {%- endcomment -%}
<script>
  (function () {
    var loaded = false;
    function load(cb) {
      if (window.Tally) return cb && cb();
      if (loaded) return;
      loaded = true;
      var s = document.createElement('script');
      s.src = 'https://tally.so/widgets/embed.js';
      s.onload = function () { if (cb) cb(); };
      document.body.appendChild(s);
    }
    /* fetch the small Tally script when a button comes near, so the first click opens instantly */
    var btns = document.querySelectorAll('[data-contact-form]');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (e) { if (e.some(function (x) { return x.isIntersecting; })) { load(); io.disconnect(); } }, { rootMargin: '400px' });
      btns.forEach(function (b) { io.observe(b); });
    }
    btns.forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        var open = function () {
          window.Tally.openPopup(b.dataset.contactForm, { layout: 'modal', width: 620, overlay: true, autoClose: 4000 });
        };
        if (window.Tally) open();
        else load(function () { if (window.Tally) open(); else window.open(b.href, '_blank', 'noopener'); });
        setTimeout(function () { if (!window.Tally) window.open(b.href, '_blank', 'noopener'); }, 4000);
      });
    });
  })();
</script>
