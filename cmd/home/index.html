  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0e0f11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home">
  <meta name="format-detection" content="telephone=no">
  <title>Home</title>
  <link href="/assets/img/favicon.png?v=9bc342e29a" rel="icon">
  <link href="/assets/img/cmd/apple-180.png" rel="apple-touch-icon">
  <link href="/cmd/home/manifest.webmanifest" rel="manifest">
  <link href="/cmd/assets/bi/bi.css?v=e404af7e90" rel="stylesheet">
  <link href="/cmd/home/app.css?v=3910ad8c29" rel="stylesheet">
  <script>
    /* Settings → Appearance, before the first paint (this phone only) */
    (function () { try { var a = JSON.parse(localStorage.getItem('home.look')) || {}, r = document.documentElement;
      if (a.theme === 'light' || a.theme === 'dark') r.setAttribute('data-theme', a.theme);
      if (/^(blue|purple|pink|orange|green)$/.test(a.acc || '')) r.setAttribute('data-acc', a.acc);
      if (a.size === 's' || a.size === 'l') r.setAttribute('data-size', a.size);
      if (a.theme === 'light') document.querySelector('meta[name=theme-color]').setAttribute('content', '#f4f5f7');
    } catch (e) {} })();
  </script>
</head>
<body>
  <!-- The shared app: only the shared box. No part of the private dashboard is loaded on this page. -->
  <main id="app" aria-live="polite"><p class="h-wait"><i class="bi bi-house-heart"></i></p></main>
  <div class="h-toast" id="toast" role="status"></div>
  <script>
    /* the avatar maker is borrowed from the dashboard; it only needs to know there's no vault here */
    window.Vault = { onUnlock: function () {}, onLock: function () {}, get: function () { return null; } };
    window.I18N = { lang: (function () { try { var v = localStorage.getItem('home.lang'); if (v) return v; } catch (e) {} return /^(nb|no|nn)/i.test(navigator.language || '') ? 'nb' : 'en'; })() };
  </script>
  <script src="/cmd/avatar.js?v=d7958ceb4d"></script>
  <script src="/cmd/avatar-rig.js?v=f7fb333ead"></script>
  <script src="/cmd/scene-kit.js?v=1b4b0473b9"></script>
  <script src="/cmd/avatar-page.js?v=58c15b9418"></script>
  <script src="/cmd/share-core.js?v=106c0d5aa9"></script>
  <script src="/cmd/chat.js?v=8dde9bda82"></script>
  <script src="/cmd/home/app.js?v=64"></script>
</body>
</html>
